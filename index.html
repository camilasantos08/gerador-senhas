<!DOCTYPE html> <html lang="pt-br">

<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Gerador de Senhas</title> <link rel="stylesheet" href="style.css"> </head>

<body>

<!-- CONTROLE DE VIDEOGAME --> <div class="controle">

<div class="controle-botoes"> <span class="direcional">+</span> </div>

<div class="botoes"> <span>A</span> <span>B</span> </div>

</div>

<main class="pagina">

<!-- ÁREA PRINCIPAL --> <section class="area-principal">

<header class="cabecalho">

<p class="pequeno">PASSWORD // GAME</p>

<h1>Crie uma senha segura</h1>

<p> Monte sua senha, aumente sua pontuação e alcance o nível máximo. </p>

</header>

<!-- GERADOR --> <section class="gerador">

<label for="campo-senha">SUA SENHA</label>

<div class="campo">

<input type="text" id="campo-senha" readonly >

<button id="copiar"> COPIAR </button>

</div>

<!-- PARAMETROS --> <div class="parametros">

<!-- TAMANHO --> <div class="parametro">

<h3>Tamanho</h3>

<div class="tamanho">

<button class="parametro-senhabotao"> − </button>

<p class="parametro-senhatexto"> 12 </p>

<button class="parametro-senhabotao"> + </button>

</div>

</div>

<!-- CARACTERÍSTICAS --> <div class="parametro caracteristicas">

<div class="titulo-caracteristicas">

<h3>TIPO DE SENHA</h3>

<span>SELECIONE</span>

</div>

<div class="opcoes">

<!-- MAIÚSCULAS --> <label class="opcao">

<input type="checkbox" class="checkbox" checked >

<span class="icone"> A </span>

<span class="texto-opcao">

<strong> Maiúsculas </strong>

<small> A B C D </small>

</span>

</label>

<!-- MINÚSCULAS --> <label class="opcao">

<input type="checkbox" class="checkbox" checked >

<span class="icone"> a </span>

<span class="texto-opcao">

<strong> Minúsculas </strong>

<small> a b c d </small>

</span>

</label>

<!-- NÚMEROS --> <label class="opcao">

<input type="checkbox" class="checkbox" checked >

<span class="icone"> # </span>

<span class="texto-opcao">

<strong> Números </strong>

<small> 1 2 3 4 </small>

</span>

</label>

<!-- SÍMBOLOS --> <label class="opcao">

<input type="checkbox" class="checkbox" checked >

<span class="icone"> ! </span>

<span class="texto-opcao">

<strong> Símbolos </strong>

<small> ! @ # $ </small>

</span>

</label>

</div>

</div>

</div>

</section>

</section>

<!-- PAINEL DIREITO --> <aside class="painel-seguranca">

<!-- SCORE --> <div class="placar">

<span class="placar-titulo"> SCORE </span>

<strong id="pontuacao"> 0 </strong>

<small> PONTOS </small>

</div>

<!-- SEGURANÇA --> <div class="seguranca">

<div class="titulo-forca">

<h3> SEGURANÇA </h3>

<span id="nivel"> FORTE </span>

</div>

<div class="barra">

<div class="forca"></div>

</div>

<div class="legenda">

<span> <i class="muito-fraca"></i> Muito fraca </span>

<span> <i class="fraca"></i> Fraca </span>

<span> <i class="moderada"></i> Moderada </span>

<span> <i class="forte"></i> Forte </span>

<span> <i class="legendaria"></i> Legendária </span>

</div>

<p class="entropia"></p>

</div>

</aside>

</main>

<script src="main.js"></script>

</body>

</html>
