<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de Senhas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CONTROLE DE VIDEOGAME -->
    <div class="controle" aria-hidden="true">

        <div class="controle-botoes">
            <span class="direcional">+</span>
        </div>

        <div class="botoes">
            <span>A</span>
            <span>B</span>
        </div>

    </div>


    <main class="pagina">

        <!-- ÁREA PRINCIPAL -->
        <section class="area-principal">

            <header class="cabecalho">

                <p class="pequeno">PASSWORD // GAME</p>

                <h1>Crie uma senha segura</h1>

                <p>
                    Gere palavras legíveis e transforme-as
                    em senhas inteligentes usando Leetspeak.
                </p>

            </header>


            <!-- GERADOR -->
            <section class="gerador">

                <label for="campo-senha">SUA SENHA</label>

                <div class="campo">

                    <input
                        type="text"
                        id="campo-senha"
                        readonly
                        aria-label="Senha gerada"
                    >

                    <button
                        id="copiar"
                        type="button"
                    >
                        COPIAR
                    </button>

                </div>


                <!-- PALAVRA BASE -->
                <div class="palavra-gerada">

                    <div>

                        <span class="mini-label">
                            PALAVRA BASE
                        </span>

                        <strong id="palavra-base">
                            —
                        </strong>

                    </div>

                    <button
                        id="nova-palavra"
                        type="button"
                    >
                        ↻ NOVA
                    </button>

                </div>


                <!-- MODO -->
                <div class="modo">

                    <button
                        type="button"
                        class="modo-botao ativo"
                        data-modo="leetspeak"
                    >
                        <span>01</span>
                        LEETSPEAK
                    </button>

                    <button
                        type="button"
                        class="modo-botao"
                        data-modo="aleatoria"
                    >
                        <span>02</span>
                        ALEATÓRIA
                    </button>

                </div>


                <!-- PARÂMETROS -->
                <div class="parametros">

                    <!-- TAMANHO -->
                    <div class="parametro tamanho-parametro">

                        <div class="titulo-parametro">

                            <div>

                                <h3>Tamanho</h3>

                                <span>
                                    COMPRIMENTO DA SENHA
                                </span>

                            </div>

                            <strong id="valor-tamanho">
                                12
                            </strong>

                        </div>


                        <div class="slider-area">

                            <span>4</span>

                            <input
                                type="range"
                                id="tamanho"
                                min="4"
                                max="30"
                                value="12"
                                aria-label="Tamanho da senha"
                            >

                            <span>30</span>

                        </div>

                    </div>


                    <!-- CARACTERÍSTICAS -->
                    <div class="parametro caracteristicas">

                        <div class="titulo-caracteristicas">
